<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>GM Encoder</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2230; --bd:#30363d;
    --tx:#c9d1d9; --mut:#8b949e; --acc:#f78166; --grn:#3fb950; --blu:#58a6ff;
    --yel:#d29922; --pur:#bc8cff; --red:#f85149;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif}
  header{display:flex;align-items:center;gap:14px;padding:14px 20px;background:var(--panel);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
  header h1{font-size:18px;margin:0;font-weight:700}
  header .logo{width:30px;height:30px;border-radius:7px;background:linear-gradient(135deg,#1e3a8a,#0e2b5a);display:flex;align-items:center;justify-content:center;font-weight:800;color:#eef4ff;font-size:13px}
  .badge{padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
  .b-idle{background:#21262d;color:var(--mut)} .b-encoding{background:#132e1a;color:var(--grn)}
  .b-paused{background:#3a2e12;color:var(--yel)} .b-stopping{background:#3a1616;color:var(--red)}
  .spacer{flex:1}
  .btn{background:var(--panel2);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:7px 14px;cursor:pointer;font-size:13px;font-weight:600}
  .btn:hover{border-color:var(--acc)} .btn.acc{background:var(--acc);color:#111;border-color:var(--acc)}
  .btn.warn{border-color:var(--yel)} .btn.danger{border-color:var(--red);color:var(--red)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  main{max-width:1200px;margin:0 auto;padding:20px;display:grid;gap:16px;grid-template-columns:1fr 1fr}
  .card{background:var(--panel);border:1px solid var(--bd);border-radius:10px;padding:16px}
  .card h2{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut)}
  .full{grid-column:1/-1}
  .bar{height:22px;background:#0b0f16;border:1px solid var(--bd);border-radius:6px;overflow:hidden;position:relative}
  .bar>span{display:block;height:100%;width:0;transition:width .4s ease;background:linear-gradient(90deg,var(--grn),#2ea043)}
  .bar.cpu>span{background:linear-gradient(90deg,var(--yel),#b8860b)}
  .bar.gpu>span{background:linear-gradient(90deg,var(--pur),#8957e5)}
  .bar .lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff;text-shadow:0 1px 2px #000}
  .row{display:flex;justify-content:space-between;gap:10px;margin:6px 0}
  .mut{color:var(--mut)} .big{font-size:16px;font-weight:700}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--bd)}
  th{color:var(--mut);font-weight:600;font-size:12px}
  .files{max-height:260px;overflow:auto}
  label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
  input,select{width:100%;background:#0b0f16;color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:7px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  pre{background:#0b0f16;border:1px solid var(--bd);border-radius:6px;padding:10px;max-height:280px;overflow:auto;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;margin:0;white-space:pre-wrap;word-break:break-word}
  .pill{font:11px ui-monospace,monospace;background:#0b0f16;border:1px solid var(--bd);border-radius:5px;padding:2px 7px}
  @media(max-width:820px){main{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="logo">GM</div>
  <h1>GM Encoder</h1>
  <span id="state" class="badge b-idle">idle</span>
  <span id="codec" class="pill">codec …</span>
  <span class="spacer"></span>
  <button id="btnPause" class="btn warn" onclick="control('pause')">Pause</button>
  <button id="btnStop" class="btn danger" onclick="control('stop')">Stop current</button>
</header>

<main>
  <!-- Now encoding -->
  <section class="card full">
    <h2>Now encoding</h2>
    <div class="row"><div id="curFile" class="big">— idle —</div><div id="curMeta" class="mut"></div></div>
    <div class="row mut"><span id="curPhase">—</span><span id="curStep"></span></div>
    <div class="bar"><span id="prog"></span><div class="lbl" id="progLbl">0%</div></div>
    <div class="grid2" style="margin-top:12px">
      <div><label>CPU</label><div class="bar cpu"><span id="cpu"></span><div class="lbl" id="cpuLbl">–</div></div></div>
      <div><label>GPU</label><div class="bar gpu"><span id="gpu"></span><div class="lbl" id="gpuLbl">–</div></div></div>
    </div>
  </section>

  <!-- Files / manual encode -->
  <section class="card">
    <h2>Input files <span id="inCount" class="pill"></span>
      <button class="btn" style="float:right;padding:3px 10px" onclick="loadFiles()">↻</button></h2>
    <div class="files"><table><tbody id="fileRows"><tr><td class="mut">loading…</td></tr></tbody></table></div>
  </section>

  <!-- Queue -->
  <section class="card">
    <h2>Manual queue <button class="btn" style="float:right;padding:3px 10px" onclick="control('clear_queue')">Clear</button></h2>
    <div class="files"><table><tbody id="queueRows"><tr><td class="mut">empty</td></tr></tbody></table></div>
  </section>

  <!-- Settings -->
  <section class="card full">
    <h2>Settings <span class="mut" style="text-transform:none;letter-spacing:0">(applies to auto + manual jobs, no restart)</span></h2>
    <div id="settings" class="grid2"></div>
    <div style="margin-top:14px;display:flex;gap:10px;align-items:center">
      <button class="btn acc" onclick="saveSettings()">Save settings</button>
      <span id="saveMsg" class="mut"></span>
    </div>
  </section>

  <!-- History -->
  <section class="card">
    <h2>Recent completed</h2>
    <table><thead><tr><th>File</th><th>Codec</th><th>CRF</th><th>VMAF</th><th>Ratio</th><th>Time</th></tr></thead>
    <tbody id="histRows"><tr><td class="mut" colspan="6">none yet</td></tr></tbody></table>
  </section>

  <!-- Log -->
  <section class="card">
    <h2>Log</h2>
    <pre id="log">…</pre>
  </section>
</main>

<script>
const $=id=>document.getElementById(id);
async function api(p,m='GET',b){const o={method:m,headers:{'Content-Type':'application/json'}};if(b)o.body=JSON.stringify(b);const r=await fetch(p,o);return r.json();}
function setBar(el,lbl,v,txt){el.style.width=(v==null?0:Math.max(0,Math.min(100,v)))+'%';lbl.textContent=txt;}

async function refresh(){
  let s; try{s=await api('/api/status');}catch(e){return;}
  const st=s.state||'idle';
  const badge=$('state'); badge.textContent=s.paused&&st!=='encoding'?'paused':st;
  badge.className='badge b-'+(s.paused&&st!=='encoding'?'paused':st);
  $('codec').textContent='codec '+(s.resolved_codec||'?');
  $('btnPause').textContent=s.paused?'Resume':'Pause';
  $('btnPause').setAttribute('onclick',`control('${s.paused?'resume':'pause'}')`);
  $('inCount').textContent=(s.input_count||0)+' files';

  if(st==='encoding'){
    $('curFile').textContent=s.cur_file||'…';
    $('curMeta').textContent=(s.cur_res||'')+(s.size_in_mb?'  •  '+s.size_in_mb+' MB':'');
    $('curPhase').textContent=s.phase||'';
    $('curStep').textContent=s.step||'';
    setBar($('prog'),$('progLbl'),s.progress||0,(s.progress||0)+'%');
  }else{
    $('curFile').textContent='— '+(s.paused?'paused':'idle')+' —';
    $('curMeta').textContent=''; $('curPhase').textContent=''; $('curStep').textContent='';
    setBar($('prog'),$('progLbl'),0,'0%');
  }
  setBar($('cpu'),$('cpuLbl'),s.cpu,s.cpu==null?'n/a':s.cpu+'%');
  setBar($('gpu'),$('gpuLbl'),s.gpu,s.gpu==null?'n/a':s.gpu+'%');

  // queue
  const q=s.queue||[]; const qr=$('queueRows');
  qr.innerHTML=q.length?q.map(f=>`<tr><td>${esc(f.split('/').pop())}</td></tr>`).join(''):'<tr><td class="mut">empty</td></tr>';
  // history
  const h=s.history||[]; const hr=$('histRows');
  hr.innerHTML=h.length?h.map(x=>`<tr><td>${esc(x.file)}</td><td>${esc(x.codec)}</td><td>${x.crf||''}</td><td>${x.vmaf||''}</td><td>${x.ratio}%</td><td>${x.elapsed}s</td></tr>`).join(''):'<tr><td class="mut" colspan="6">none yet</td></tr>';
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

async function loadFiles(){
  const d=await api('/api/files'); const rows=$('fileRows');
  if(!d.input||!d.input.length){rows.innerHTML='<tr><td class="mut">no video files in /input</td></tr>';return;}
  rows.innerHTML=d.input.map(f=>`<tr><td>${esc(f.rel)}</td><td class="mut" style="white-space:nowrap">${f.size_mb} MB</td>
    <td style="text-align:right"><button class="btn" style="padding:3px 10px" onclick='enc(${JSON.stringify(f.path)})'>Encode</button></td></tr>`).join('');
}
async function enc(path){await api('/api/encode','POST',{file:path});refresh();}
async function control(a){await api('/api/control','POST',{action:a});refresh();}

async function loadSettings(){
  const d=await api('/api/settings'); const box=$('settings'); box.innerHTML='';
  d.schema.forEach(f=>{
    const v=d.values[f.key]; const w=document.createElement('div');
    let ctrl;
    if(f.kind==='select'){ctrl=`<select data-k="${f.key}">`+f.options.map(o=>`<option ${o==v?'selected':''}>${o}</option>`).join('')+`</select>`;}
    else{ctrl=`<input data-k="${f.key}" type="${f.kind==='number'?'number':'text'}" value="${esc(v)}" step="any"/>`;}
    w.innerHTML=`<label>${f.label}</label>${ctrl}`; box.appendChild(w);
  });
}
async function saveSettings(){
  const body={}; document.querySelectorAll('#settings [data-k]').forEach(e=>body[e.dataset.k]=e.value);
  await api('/api/settings','POST',body);
  $('saveMsg').textContent='saved ✓ (applies to next job)'; setTimeout(()=>$('saveMsg').textContent='',3000);
}
async function loadLog(){const d=await api('/api/log?lines=160');const p=$('log');const atBottom=p.scrollTop+p.clientHeight>=p.scrollHeight-20;p.textContent=(d.lines||[]).join('\n');if(atBottom)p.scrollTop=p.scrollHeight;}

loadSettings(); loadFiles(); refresh(); loadLog();
setInterval(refresh,1500); setInterval(loadLog,2500); setInterval(loadFiles,10000);
</script>
</body>
</html>
